<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E9F8E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bayān Kids">
<title>Bayān Kids – Arabo, Ahadith e Corano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2D42; --muted:#6B7080;
  --teal:#0E9F8E; --teal-d:#0B7F72; --purple:#7C5CFF; --orange:#FF9F1C; --pink:#FF5D8F;
  --green:#2BB673; --red:#E63946; --yellow:#FFD23F; --sky:#4CC9F0;
  --r:22px; --shadow:0 6px 0 rgba(0,0,0,.08), 0 10px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-size:17px}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
.ar{font-family:"Noto Naskh Arabic","Amiri Quran",serif;direction:rtl}
.quran{font-family:"Amiri Quran","Noto Naskh Arabic",serif;direction:rtl}
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 0 var(--teal-d)}
header h1{font-size:21px;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);font-size:22px;color:#fff;display:none}
.back.show{display:block}
.stars{background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;display:flex;gap:4px;align-items:center}
.stars.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35)}}
main{max-width:860px;margin:0 auto;padding:16px}
.hello{display:flex;gap:12px;align-items:center;margin:4px 0 16px}
.hello .owl{width:86px;flex:none}
.bubble{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);position:relative;font-weight:600;line-height:1.35}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:820px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.tile{border-radius:var(--r);padding:18px;color:#fff;text-align:left;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-height:110px;transition:transform .1s}
.tile:active{transform:translateY(3px)}
.tile .em{font-size:48px;line-height:1}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile small{opacity:.92;font-size:15px;line-height:1.25;display:block;margin-top:4px}
.c-teal{background:var(--teal)}.c-purple{background:var(--purple)}.c-orange{background:var(--orange)}.c-pink{background:var(--pink)}.c-green{background:var(--green)}.c-sky{background:var(--sky)}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.list{display:grid;gap:12px}
@media(min-width:560px){.list{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.num{width:42px;height:42px;border-radius:14px;background:#EAF7F5;color:var(--teal-d);font-weight:800;display:grid;place-items:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:18px;line-height:1.1}
.row .t small{color:var(--muted)}
.row .arn{font-size:24px;color:var(--teal-d)}
.bar{height:8px;background:#EEE;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.sec-title{font-size:22px;font-weight:800;margin:6px 0 12px}
.note{background:#FFF1D6;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.35;margin:10px 0}
.note.err{background:#FFE1E4}
.btn{border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);background:var(--teal);color:#fff;font-size:18px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.sec{background:#fff;color:var(--ink)}
.btn.big{padding:16px 22px;font-size:21px}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}.btn.orange{background:var(--orange)}
.btn[disabled]{opacity:.45}
/* Owl */
.owl svg{width:100%;height:auto;display:block}
.owl .happy{display:none}
.owl.happy .pupil{display:none}.owl.happy .happy{display:block}
.owl.talk .beak{animation:talk .22s infinite alternate;transform-origin:60px 66px}
@keyframes talk{to{transform:scaleY(1.45)}}
.owl.listen .mic{display:block}
.owl .mic{display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.owl.sad .pupil{transform:translateY(3px)}
/* Lesson */
.teacher{display:flex;gap:12px;align-items:center}
.teacher .owl{width:96px;flex:none}
.teacher .bubble{flex:1;font-size:18px;min-height:56px}
.ayah{margin-top:14px;text-align:center}
.ayah .meta{color:var(--muted);font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.ayah .txt{font-size:34px;line-height:2.05;padding:10px 4px;word-spacing:4px}
.ayah .txt.ar{font-size:30px;line-height:1.9}
.ayah .w{border-radius:10px;padding:0 3px;transition:background .3s}
.w.ok{background:#D5F5E3}.w.close{background:#FFE9C2}.w.bad{background:#FFD6DA;text-decoration:underline wavy var(--red)}
.ayah .tr{color:var(--muted);font-style:italic;font-size:15px}
.ayah .it{font-size:17px;margin-top:6px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.dots i{width:22px;height:22px;border-radius:50%;background:#E6E6E6;display:block;transition:background .3s}
.dots i.on{background:var(--green)}
.dots i.cur{box-shadow:0 0 0 3px var(--yellow)}
.heard{min-height:24px;text-align:center;color:var(--muted);font-size:16px;margin:6px 0}
.heard .ar{font-size:20px;color:var(--ink)}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.controls .sq{width:58px;height:58px;border-radius:18px;font-size:24px;padding:0}
.extra{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:#F0F0F0;font-weight:700;font-size:16px}
.chip.on{background:var(--teal);color:#fff}
.set-row{margin:12px 0}
.set-row>label{display:block;font-weight:800;margin-bottom:6px}
details.settings{margin-top:14px}
details.settings summary{font-weight:800;cursor:pointer;padding:6px 0;font-size:18px}
select{font:inherit;padding:8px 10px;border-radius:12px;border:2px solid #E2E2E2;background:#fff;width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-weight:600}
.switch input{width:24px;height:24px;accent-color:var(--teal)}
.ayah-nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ayah-nav button{width:40px;height:40px;border-radius:12px;background:#F0F0F0;font-weight:800}
.ayah-nav button.done{background:#D5F5E3;color:#137a46}
.ayah-nav button.cur{outline:3px solid var(--orange)}
/* Games */
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:rtl}
@media(min-width:560px){.letters{grid-template-columns:repeat(7,1fr)}}
.letter{aspect-ratio:1;border-radius:18px;font-size:38px;background:#fff;box-shadow:var(--shadow);font-family:"Noto Naskh Arabic",serif;display:grid;place-items:center;position:relative}
.letter.seen:after{content:"⭐";position:absolute;top:2px;right:6px;font-size:13px}
.big-letter{text-align:center}
.big-letter .L{font-size:110px;line-height:1.2;font-family:"Noto Naskh Arabic",serif;color:var(--purple)}
.forms{display:flex;justify-content:center;gap:10px;direction:rtl;flex-wrap:wrap}
.forms span{background:#F4F0FF;border-radius:12px;padding:4px 10px;font-size:34px;font-family:"Noto Naskh Arabic",serif;min-width:60px}
.forms small{display:block;font-size:12px;color:var(--muted);font-family:"Baloo 2"}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px 8px;font-size:40px;min-height:96px}
.opt.word{font-size:30px}
.opt.right{background:#D5F5E3}.opt.wrong{background:#FFD6DA;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q-emoji{font-size:96px;text-align:center;line-height:1.1}
.progress-txt{text-align:center;font-weight:800;color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.mcard{aspect-ratio:3/4;border-radius:18px;background:var(--purple);color:#fff;font-size:30px;box-shadow:var(--shadow);display:grid;place-items:center;padding:4px}
.mcard .face{display:none}
.mcard.open,.mcard.done{background:#fff;color:var(--ink)}
.mcard.open .face,.mcard.done .face{display:block}
.mcard.open .backf,.mcard.done .backf{display:none}
.mcard.done{background:#D5F5E3}
.mcard .face.ar{font-size:26px}
.mcard .face.em{font-size:46px}
/* Hadith */
.h-ar{font-size:24px;line-height:1.7;text-align:right}
.h-it{color:var(--muted);font-size:15px;margin-top:2px}
.src{font-size:13px;color:var(--teal-d);font-weight:700;margin-top:6px}
.puzzle .slots{min-height:64px;border:3px dashed #DDD;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin:10px 0}
.puzzle .pool{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}
.wchip{background:#fff;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.12);padding:6px 12px;font-size:24px;font-family:"Noto Naskh Arabic",serif}
.wchip.bad{background:#FFD6DA;animation:shake .4s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-size:26px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hidden{display:none!important}
input[type=range]{width:100%;accent-color:var(--purple);height:30px}
.slider{margin:8px 0}.slider label{display:flex;justify-content:space-between;font-weight:700}
.recitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0F0F0}
.recitem .t{flex:1;min-width:0;font-weight:700;font-size:15px}.recitem small{display:block;color:var(--muted);font-weight:500}
.recitem button{width:44px;height:44px;border-radius:14px;background:#F0F0F0;font-size:20px}
.steps{margin:6px 0 0 0;padding-left:20px;line-height:1.45}
.lvl{height:14px;background:#EEE;border-radius:9px;overflow:hidden;margin:8px auto 0;max-width:260px}
.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .08s}
.rec-badge{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:800;font-size:15px}
.rec-badge:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
.w.focus{outline:3px solid var(--orange);background:#FFF1D6}
.wtag{display:inline-block;background:#FFD6DA;border-radius:8px;padding:0 6px;margin:2px;font-family:"Noto Naskh Arabic",serif;font-size:20px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F0F0F0;font-weight:600}
.chk b{font-size:20px}
input.name{font:inherit;font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid #E2E2E2;width:100%}
.center{text-align:center}
.mt{margin-top:14px}

/* ======== TEMA BAMBINI ======== */
body{background:
  radial-gradient(circle at 12% 8%, rgba(255,255,255,.9) 0 26px, transparent 27px),
  radial-gradient(circle at 18% 9%, rgba(255,255,255,.9) 0 20px, transparent 21px),
  radial-gradient(circle at 84% 14%, rgba(255,255,255,.85) 0 22px, transparent 23px),
  radial-gradient(circle at 90% 13%, rgba(255,255,255,.85) 0 16px, transparent 17px),
  linear-gradient(180deg,#7FD1FF 0,#BDE9FF 260px,#E8F8FF 420px,#FFF8EC 640px);
  background-repeat:no-repeat;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,.sec-title,.tile b,.mtile b,.btn,.hero b,.banner b{font-family:"Fredoka","Baloo 2",sans-serif}
header{background:linear-gradient(120deg,#0E9F8E,#18B6C9 55%,#4C8DFF);box-shadow:0 6px 0 rgba(11,127,114,.35);
  border-radius:0 0 26px 26px;padding-bottom:12px}
header h1{font-size:23px;font-weight:700;letter-spacing:.2px}
.back{background:rgba(255,255,255,.25);border-radius:16px}
.stars{background:linear-gradient(180deg,#FFE680,#FFC93C);box-shadow:0 3px 0 #E0A800;font-size:18px}
main{padding:18px 16px}
.card{border-radius:26px;box-shadow:0 7px 0 rgba(0,0,0,.06),0 12px 26px rgba(30,60,90,.08)}
.bubble{border-radius:22px;border:3px solid #E5F4FF;box-shadow:0 5px 0 rgba(0,0,0,.05)}
.bubble:before{border-right-color:#E5F4FF;left:-13px}
.owl svg .pg{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 112px}
@keyframes bob{50%{transform:translateY(-2.5px) rotate(-1.5deg)}}
.owl .eyes{animation:blink 4.5s infinite;transform-origin:60px 47px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.owl .flipL,.owl .flipR{transition:transform .35s}
.owl .flipL{transform-origin:30px 64px}.owl .flipR{transform-origin:90px 64px}
.owl.happy svg .pg{animation:hop .55s ease 3}
@keyframes hop{50%{transform:translateY(-9px)}}
.owl.happy .flipL{transform:rotate(38deg)}.owl.happy .flipR{transform:rotate(-38deg)}
.owl.listen .flipL{animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(22deg)}}
.owl.talk .beak{transform-origin:60px 55px}
.owl.happy .eyes{animation:none}
.owl.sad .pupil{transform:translateY(2.5px)}
.owl.sad .flipL{transform:rotate(-8deg)}.owl.sad .flipR{transform:rotate(8deg)}
/* hero */
.hero{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.hero .owlH{width:128px;flex:none}
.hero .bubble{font-size:18px;flex:1}
.level{display:flex;align-items:center;gap:12px;padding:12px 14px}
.level .medal{width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#FFE680,#FFB703);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #E09A00;flex:none}
.level .t{flex:1}.level b{font-family:"Fredoka","Baloo 2",sans-serif;font-size:19px}
.level .bar{height:12px;background:#FFF1C9}.level .bar i{background:linear-gradient(90deg,#FFB703,#FB8500)}
.level small{color:var(--muted)}
/* menu */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
.mtile{position:relative;overflow:hidden;border-radius:30px;padding:18px 10px 16px;color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:168px;justify-content:center;transition:transform .12s}
.mtile:active{transform:translateY(5px) scale(.98)}
.mtile:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);top:-40px;right:-40px}
.mtile:before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-24px;left:-18px}
.mtile .ic{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:44px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.mtile b{font-size:21px;line-height:1.05;position:relative;z-index:1}
.mtile small{font-size:14px;opacity:.95;line-height:1.2;position:relative;z-index:1}
.mtile.wide{grid-column:1/-1;flex-direction:row;min-height:auto;justify-content:flex-start;text-align:left;padding:14px 18px}
.mtile.wide .ic{width:58px;height:58px;font-size:32px}
.g-purple{background:linear-gradient(160deg,#9B7BFF,#6A45F0);box-shadow:0 8px 0 #4F2FC9}
.g-teal{background:linear-gradient(160deg,#20C3AE,#0B8F80);box-shadow:0 8px 0 #07695E}
.g-orange{background:linear-gradient(160deg,#FFB547,#FF8A00);box-shadow:0 8px 0 #D46F00}
.g-pink{background:linear-gradient(160deg,#FF7EA8,#F2477E);box-shadow:0 8px 0 #C72D60}
.g-sky{background:linear-gradient(160deg,#5DD3F5,#2196F3);box-shadow:0 8px 0 #1673C2}
.g-green{background:linear-gradient(160deg,#5AD58F,#22A75E);box-shadow:0 8px 0 #178347}
/* banner di sezione */
.banner{border-radius:28px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:16px;position:relative;overflow:hidden}
.banner .ic{font-size:46px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.banner b{display:block;font-size:24px;line-height:1.1}.banner small{font-size:15px;opacity:.95}
.banner:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.13);top:-50px;right:-30px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(30,60,90,.12)}
.tabbar a{flex:1;text-decoration:none;color:var(--muted);font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:18px;font-family:"Fredoka","Baloo 2",sans-serif}
.tabbar a span{font-size:25px;line-height:1.1;transition:transform .2s}
.tabbar a.on{color:var(--teal-d);background:#E3F7F4}
.tabbar a.on span{transform:translateY(-3px) scale(1.15)}
/* stella a 8 punte per i numeri delle sure */
.snum{position:relative;width:48px;height:48px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-family:"Fredoka","Baloo 2",sans-serif;font-size:15px}
.snum:before,.snum:after{content:"";position:absolute;inset:7px;border-radius:7px;background:var(--teal)}
.snum:after{transform:rotate(45deg)}
.snum i{position:relative;z-index:1;font-style:normal}
.snum.done:before,.snum.done:after{background:#FFB703}
.list .card.row{border:3px solid transparent}
.list .card.row:active{border-color:#BDEFE8;transform:scale(.99)}
.num{border-radius:16px;background:linear-gradient(180deg,#FFE9C2,#FFD08A);color:#8A4B00}
.teacher .owl{width:112px}
.letter{border-radius:22px;box-shadow:0 6px 0 #E4DCFF;border:3px solid #EFE9FF;color:#5B3FD9}
.opt{border:3px solid #EEF2F7}
.mcard{background:linear-gradient(160deg,#9B7BFF,#6A45F0);box-shadow:0 6px 0 #4F2FC9}
.btn{border-radius:18px}
.namebox{display:flex;gap:8px;align-items:center}
#stars{display:none!important}
/* ===== FAMILY QUIZ ===== */
.fq-stage{position:relative;overflow:hidden;border-radius:30px;padding:22px 16px 18px;color:#fff;text-align:center;
  background:radial-gradient(ellipse at 50% 120%,#6A45F0 0,#2A1B6E 45%,#120C3A 100%);box-shadow:0 8px 0 #0B0726}
.fq-stage:before,.fq-stage:after{content:"";position:absolute;top:-40px;width:140px;height:340px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));filter:blur(2px);transform-origin:top center;animation:spot 5s ease-in-out infinite}
.fq-stage:before{left:8%;transform:rotate(18deg)}.fq-stage:after{right:8%;transform:rotate(-18deg);animation-delay:-2.5s}
@keyframes spot{50%{opacity:.45}}

async function loadSura(n){
  const s = QURAN.find(x=>x.n===n); if(!s) return null; if(s.v) return s;
  try{ const c = localStorage.getItem("sura"+n); if(c){ s.v = JSON.parse(c); return s; } }catch(e){}
  try{
    const r = await fetch(`https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/${n}.json`);
    const j = await r.json();
    s.v = j.verses.map(v=>[v.text, v.transliteration||""]);
    try{ localStorage.setItem("sura"+n, JSON.stringify(s.v)); }catch(e){}
    return s;
  }catch(e){ return null; }
}

const Voice = {
  voices:[],
  init(){ if(!("speechSynthesis" in window)) return; const load=()=>{ this.voices = speechSynthesis.getVoices(); }; load(); speechSynthesis.onvoiceschanged = load; },
  find(lang){ return this.voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang)); },
  hasAr(){ return !!this.find("ar"); },
  noAr(){ return this.voices.length>0 && !this.find("ar"); },
  speak(text, lang="it", rate=1){
    return new Promise(res=>{
      if(!("speechSynthesis" in window)) return res(false);
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); const v = this.find(lang);
        if(v) u.voice = v; u.lang = v ? v.lang : (lang==="ar" ? "ar-SA" : "it-IT"); u.rate = rate;
        let done=false; const fin=ok=>{ if(!done){ done=true; res(ok); } };
        u.onend=()=>fin(true); u.onerror=()=>fin(false);
        setTimeout(()=>fin(true), 2500 + text.length*170/rate);
        speechSynthesis.speak(u);
      }catch(e){ res(false); }
    });
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};

const Player = {
  el: new Audio(), cancel:null,
  play(urls, rate=1){
    this.stop();
    return new Promise(resolve=>{
      let idx=0, settled=false;
      const end = v => { if(settled) return; settled=true; this.cancel=null; resolve(v); };
      this.cancel = () => { try{ this.el.pause(); }catch(e){} end(false); };
      const tryNext = () => {
        if(settled) return;
        if(idx>=urls.length) return end("error");
        const el=this.el; el.src = urls[idx++]; el.playbackRate = rate; try{ el.preservesPitch = true; }catch(e){}
        el.onended = () => end(true);
        el.onerror = () => tryNext();
        const p = el.play();
        if(p && p.catch) p.catch(err => { if(err && err.name==="NotAllowedError") end("blocked"); });
      };
      tryNext();
    });
  },
  stop(){ if(this.cancel) this.cancel(); },
  unlock(){ if(this.cancel) return; try{ this.el.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; const p=this.el.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Rec = {
  cur:null,
  listen({maxMs=8000, onInterim}={}){
    return new Promise(resolve=>{
      if(!SR) return resolve({error:"unsupported"});
      let r; try{ r = new SR(); }catch(e){ return resolve({error:"unsupported"}); }
      r.lang="ar-SA"; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
      let finals=[], lastAlts=[], interim="", err=null, settled=false;
      r.onresult = e => {
        finals=[]; interim=""; lastAlts=[];
        for(let i=0;i<e.results.length;i++){
          const res=e.results[i];
          if(res.isFinal){ finals.push(res[0].transcript); lastAlts=[]; for(let k=0;k<res.length;k++) lastAlts.push(res[k].transcript); }
          else interim += res[0].transcript;
        }
        onInterim && onInterim((finals.join(" ")+" "+interim).trim());
      };
      r.onerror = e => { err = e.error; };
      const t = setTimeout(()=>{ try{ r.stop(); }catch(e){} }, maxMs);
      r.onend = () => {
        if(settled) return; settled=true; clearTimeout(t); this.cur=null;
        const text = (finals.join(" ").trim()) || interim.trim();
        let cands = [text];
        if(finals.length>0 && lastAlts.length>1){
          const head = finals.slice(0,-1).join(" ");
          cands = lastAlts.map(a => (head+" "+a).trim());
        }
        resolve({text, cands: cands.filter(Boolean), error: text ? null : (err || "no-speech")});
      };
      this.cur = r;
      try{ r.start(); }catch(e){ settled=true; clearTimeout(t); resolve({error:"start"}); }
    });
  },
  stop(){ if(this.cur){ try{ this.cur.abort(); }catch(e){} this.cur=null; } }
};

const Mic = {
  stream:null, rec:null, chunks:[], url:null, ctx:null, src:null, an:null, level:0, peak:0, onLevel:null, raf:0,
  supported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async open(){
    if(this.stream) return true;
    try{ this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); this.err=null; return true; }
    catch(e){ this.err = e.name || "error"; return false; }
  },
  start(){
    if(!this.stream) return false;
    this.chunks=[]; this.peak=0;
    try{ this.rec = new MediaRecorder(this.stream); this.rec.ondataavailable = e => { if(e.data && e.data.size) this.chunks.push(e.data); }; this.rec.start(); }
    catch(e){ return false; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ if(!this.ctx) this.ctx = new AC(); if(this.ctx.state==="suspended") this.ctx.resume();
        this.src = this.ctx.createMediaStreamSource(this.stream); this.an = this.ctx.createAnalyser(); this.an.fftSize=512; this.src.connect(this.an);
        const buf = new Uint8Array(this.an.fftSize);
        const loop = () => { if(!this.an) return; this.an.getByteTimeDomainData(buf); let sum=0; for(const v of buf){ const x=(v-128)/128; sum+=x*x; }
          this.level = Math.min(1, Math.sqrt(sum/buf.length)*4); this.peak = Math.max(this.peak, this.level); this.onLevel && this.onLevel(this.level); this.raf=requestAnimationFrame(loop); };
        loop(); }
    }catch(e){}
    return true;
  },
  stop(){
    cancelAnimationFrame(this.raf); try{ this.src && this.src.disconnect(); }catch(e){} this.src=null; this.an=null; this.onLevel && this.onLevel(0);
    return new Promise(res=>{
      const r=this.rec; this.rec=null;
      if(!r || r.state==="inactive") return res(null);
      r.onstop = () => { const b = new Blob(this.chunks, {type: r.mimeType || "audio/webm"}); if(this.url) URL.revokeObjectURL(this.url); this.url = b.size>1000 ? URL.createObjectURL(b) : null; res(this.url); };
      try{ r.stop(); }catch(e){ res(null); }
    });
  },
  close(){ if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; } }
};

function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
const sim = (a,b) => { const L=Math.max(a.length,b.length); return L ? 1-lev(a,b)/L : 1; };
function compareOne(target, heard){
  const T = norm(target).split(" ").filter(Boolean), H = norm(heard).split(" ").filter(Boolean);
  const n=T.length, m=H.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const s = sim(T[i-1],H[j-1]); const g = s>=.5 ? s : 0;
    dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]+g);
  }
  const labels = new Array(n).fill("bad");
  let i=n, j=m;
  while(i>0 && j>0){
    const s = sim(T[i-1],H[j-1]); const g = s>=.5 ? s : 0;
    if(g>0 && Math.abs(dp[i][j]-(dp[i-1][j-1]+g))<1e-9){
      const d = lev(T[i-1],H[j-1]), L = Math.max(T[i-1].length,H[j-1].length);
      labels[i-1] = (d===0 || (d===1 && L>=5) || s>=.8) ? "ok" : "close"; i--; j--; }
    else if(dp[i][j]===dp[i-1][j]) i--; else j--;
  }
  const credit = labels.reduce((a,l)=>a+(l==="ok"?1:l==="close"?.6:0),0);
  const wordScore = n ? credit/n : 0;
  const charScore = sim(T.join(""), H.join(""));
  const extra = Math.max(0, m-n) / Math.max(1,n);
  // il confronto "lettera per lettera" serve solo quando il riconoscimento unisce o divide le parole
  const score = (m!==n ? Math.max(wordScore, charScore) : wordScore) - Math.min(.3, extra*.25);
  return {score, labels, heard};
}
function evaluate(target, cands, sev){
  let best = {score:-1, labels:[], heard:""};
  for(const c of cands){ const r = compareOne(target,c); if(r.score>best.score) best=r; }
  const cfg = SEVERITY[sev] || SEVERITY.facile;
  const close = best.labels.filter(l=>l==="close").length;
  const bad = best.labels.filter(l=>l==="bad").length + close*(sev==="rigoroso"?1:sev==="normale"?.5:0);
  const allowed = cfg.per ? Math.floor(best.labels.length/cfg.per) : 0;
  best.bad = bad;
  best.pass = best.score >= cfg.min && bad <= allowed;
  return best;
}

    q("[data-reps]").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", +c.dataset.n===st.reps));
    q("[data-mode]").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.v===st.mode));

  rate(){ return this.set.slow ? .8 : 1; }
  warn(html){ this.el.warn.innerHTML=html; this.el.warn.classList.toggle("hidden", !html); }
  bubble(html){ this.el.b.innerHTML = html; }
  mood(m){ this.owl.className = "owl "+(m||""); }
  say(text, key){ return this.set.voice ? sayP(key, text) : Promise.resolve(); }
  show(labels){
    const it=this.o.items[this.i];
    this.el.meta.textContent = this.o.metaText(this.i);
    const words = it.ar.split(/\s+/).filter(Boolean);
    this.el.txt.innerHTML = words.map((w,k)=>`<span class="w ${labels?labels[k]||"":""}">${esc(w)}</span>`).join(" ");
    this.el.tr.textContent = (this.o.kind!=="quran" || this.set.translit) ? (it.tr||"") : "";
    this.el.it.textContent = it.it || "";
    if(!labels) this.el.heard.innerHTML="";
    this.renderNav();
  }
  renderDots(done){
    const N=this.set.reps;
    this.el.dots.innerHTML = Array.from({length:N},(_,k)=>`<i class="${k<done?"on":""} ${k===done&&this.running?"cur":""}"></i>`).join("");
    this.el.rep.textContent = `Ripetizioni: ${done}/${N}`;
  }
  renderNav(){
    if(!this.el.nav) return;
    this.el.nav.innerHTML = this.o.items.map((_,k)=>`<button class="${this.o.isDone(k)?"done":""} ${k===this.i?"cur":""}" data-k="${k}">${k+1}</button>`).join("");
    this.el.nav.onclick = e => { const k=e.target.dataset.k; if(k!==undefined) this.go(+k); };
  }
  go(i){
    if(i<0 || i>=this.o.items.length) return;
    const wasRunning = this.running;
    this.stop(); this.i=i; this.show(); this.renderDots(0);
    this.bubble(wasRunning ? "Andiamo avanti! ✨" : "Tocca <b>▶ Inizia</b> quando sei pronto.");
    if(wasRunning) this.run();
  }
  stop(msg){
    this.tok++; this.running=false; Player.stop(); Rec.stop(); Voice.stop(); Mic.stop().then(()=>Mic.close()); this.mood(""); if(this.el.recbox) this.el.recbox.classList.add("hidden");
    this.el.run.textContent="▶ Inizia"; this.el.extra.innerHTML="";
    if(msg) this.bubble(msg);
  }
  waitButtons(btns){
    return new Promise(res=>{
      this.el.extra.innerHTML = "";
      btns.forEach(([label,cls,val,fn])=>{ const b=document.createElement("button"); b.className="btn "+cls; b.innerHTML=label;
        b.onclick = fn ? fn : ()=>{ Player.unlock(); this.el.extra.innerHTML=""; res(val); }; this.el.extra.appendChild(b); });
    });
  }
  childName(){ return (S.name||"").trim(); }
  // Ascolta il bambino: riconoscimento vocale + (se possibile) registrazione della voce
  async hear(alive, maxMs, record=true){
    const st=this.set; let recOn=false;
    if(record && st.record && !st.recConflict && Mic.supported()){
      if(await Mic.open()) recOn = Mic.start();
    }
    if(!alive()){ await Mic.stop(); Mic.close(); return null; }
    if(recOn){ this.el.recbox.classList.remove("hidden"); Mic.onLevel = v => { this.el.lvl.style.width = Math.round(v*100)+"%"; }; }
    const r = SR ? await Rec.listen({maxMs, onInterim: t => { if(alive()) this.el.heard.innerHTML = `Sento: <bdi class="ar">${esc(t)}</bdi>`; }})
                 : {error:"unsupported"};
    const peak = Mic.peak;
    const url = recOn ? await Mic.stop() : null; Mic.close(); Mic.onLevel=null;
    this.el.recbox.classList.add("hidden");
    this.el.mine.classList.toggle("hidden", !url);
    // registrazione e riconoscimento insieme non funzionano su alcuni telefoni: lo capiamo e disattiviamo la registrazione
    if(recOn && (r.error==="audio-capture" || r.error==="aborted" || (r.error==="no-speech" && peak>.15))){
      this.conflicts=(this.conflicts||0)+1;
      if(r.error!=="no-speech" || this.conflicts>=2){
        st.recConflict=true; Store.save();
        this.warn("ℹ️ Su questo telefono la registrazione e l'ascolto insieme non funzionano: il maestro ora usa solo l'ascolto. (Puoi riprovare da “Prova il microfono”.)");
        return {retry:true};
      }
    } else if(recOn && !r.error) this.conflicts=0;
    return {r, url, peak, recOn};
  }
  async judgeByParent(alive, maxMs){
    // Il bambino ripete, registriamo, il genitore ascolta e decide
    const st=this.set; let url=null;
    this.mood("listen");
    if(st.record && Mic.supported() && await Mic.open() && Mic.start()){
      this.el.recbox.classList.remove("hidden"); Mic.onLevel = v => { this.el.lvl.style.width = Math.round(v*100)+"%"; };
      this.bubble("Ora ripeti tu ad alta voce! 🎤 Poi tocca <b>⏹ Ho finito</b>.");
      await this.waitButtons([["⏹ Ho finito","orange",1]]);
      url = await Mic.stop(); Mic.close(); Mic.onLevel=null; this.el.recbox.classList.add("hidden");
      if(!alive()) return null;
      this.el.mine.classList.toggle("hidden", !url);
      if(url){ this.bubble("Ascoltiamo come l'hai detta… 👂"); await Player.play([url]); if(!alive()) return null; }
    }
    this.bubble("Genitore: com'è andata? 👨‍👧");
    const btns=[["✅ Detta bene","green",true],["🔁 Da rifare","red",false]];
    if(url) btns.unshift(["▶ Riascolta","sec",null,()=>Player.play([url])]);
    const v = await this.waitButtons(btns); if(!alive()) return null;
    return {pass:v, manual:true, url};
  }
  // Correzione intelligente: fa sentire le parole sbagliate e le fa ripetere una per una
  async coach(alive, res){
    const it=this.o.items[this.i], words=it.ar.split(/\s+/);
    const wrong = res.labels.map((l,k)=>l==="ok"?-1:k).filter(k=>k>=0).slice(0,3);
    if(!wrong.length || !this.o.playWord) return;
    for(const k of wrong){
      if(!alive()) return;
      const lab = res.labels.slice(); this.show(lab);
      const span = this.el.txt.querySelectorAll(".w")[k]; if(span) span.classList.add("focus");
      this.mood("talk"); this.bubble(`Questa parola si dice così: <span class="wtag">${esc(words[k])}</span> 👂`);
      await this.say("Questa parola si dice così.","parola"); if(!alive()) return;
      let ok = await this.o.playWord(this.i, k, this.rate()); if(!alive()) return;
      if(ok!==true) return; // audio della parola non disponibile: si ripete tutta l'ayah
      for(let t=0;t<2;t++){
        this.mood("listen"); this.bubble(`Ripeti solo questa parola 🎤 <span class="wtag">${esc(words[k])}</span>`);
        if(this.set.voice && Phr.has("ripetiparola")){ await this.say("","ripetiparola"); if(!alive()) return; }
        const h = await this.hear(alive, 4500, false); if(!alive() || !h) return;
        if(h.retry) continue;
        const heard = norm(h.r.text||""); const target = norm(words[k]);
        const good = heard && heard.split(" ").some(x=>sim(x,target)>=.6) || sim(heard.replace(/ /g,""),target)>=.6;
        if(good){ goodJob(); this.mood("happy"); this.bubble("Giusto! 👍"); if(span){ span.classList.remove("bad","close","focus"); span.classList.add("ok"); }
          await this.say("Giusto!","giusto"); break; }
        this.mood("sad"); this.bubble("Ancora una volta, ascolta… 👂"); await this.say("Ancora una volta.","ancora"); if(!alive()) return;
        await this.o.playWord(this.i, k, this.rate()*.9); if(!alive()) return;
      }
      await sleep(400);
    }
    if(!alive()) return;
    this.mood("talk"); this.bubble("Bene! Ora rifacciamo tutta la frase insieme 💪"); await this.say("Bene! Ora rifacciamo tutta la frase insieme.","insieme");
  }
  async run(){
    const tok = ++this.tok; this.running=true; this.el.run.textContent="⏸ Ferma";
    const alive = () => tok===this.tok;
    const st=this.set, N=st.reps; let done=0, fails=0, replayed=false;
    this.show(); this.renderDots(0);
    if(this.o.intro){ await this.o.intro(this.i, ()=>alive(), this); if(!alive()) return; }
    while(done<N){
      if(!alive()) return;
      this.renderDots(done); this.show(); this.el.heard.innerHTML="";
      this.mood("talk");
      const nm=this.childName();
      if(!replayed){
        this.bubble(done===0 && fails===0 ? `Ascolta bene${nm?", "+esc(nm):""}… 👂` : fails ? "Ascolta di nuovo con attenzione… 👂" : `Ancora! Ripetizione <b>${done+1}</b> di ${N} 👂`);
        if(done===0 && fails===0) await this.say(`Ascolta bene${nm?", "+nm:""}.`,"ascolta"); if(!alive()) return;
        this.mood("talk");
        let ok = await this.o.play(this.i, this.rate()); if(!alive()) return;
        if(ok==="blocked"){ this.mood(""); this.bubble("Tocca il pulsante per far parlare Bayan 🔊");
          await this.waitButtons([["🔊 Ascolta","orange",1]]); if(!alive()) return; continue; }
        if(ok!==true){ this.mood("sad"); this.bubble(this.o.audioError || "Non riesco a caricare l'audio. Controlla la connessione internet 📶"); this.stop(); return; }
      }
      replayed=false;
      if(st.mode==="listen"){ done++; this.renderDots(done); this.mood(""); await sleep(800); continue; }

      let res;
      const words = this.o.items[this.i].ar.split(/\s+/).length;
      const maxMs = Math.min(30000, 5000 + words*1100/this.rate());
      if(st.mode==="parent" || this.manual || !SR){
        res = await this.judgeByParent(alive, maxMs); if(!res) return;
      } else {
        this.mood("listen"); this.bubble(`Ora tocca a te${nm?", "+esc(nm):""}! Ripeti 🎤`);
        if(this.set.voice && Phr.has("tocca")){ this.mood("talk"); await this.say("","tocca"); if(!alive()) return; this.mood("listen"); }
        const h = await this.hear(alive, maxMs); if(!alive() || !h) return;
        if(h.retry){ replayed=true; continue; }   // riprova subito l'ascolto senza registrazione
        const r = h.r;
        if(["not-allowed","service-not-allowed","unsupported","start"].includes(r.error)){
          this.manual=true;
          this.warn(micHelp(r.error==="unsupported"||r.error==="start" ? "" : r.error) || "⚠️ Il riconoscimento vocale non parte: usa Google Chrome su Android. Intanto giudica il genitore.");
          res = await this.judgeByParent(alive, maxMs); if(!res) return;
        } else if(r.error){ res = {pass:false, error:r.error, peak:h.peak}; }
        else { res = evaluate(this.o.items[this.i].ar, r.cands, st.sev); res.url=h.url; }
      }
      if(res.labels) this.show(res.labels);
      if(res.heard) this.el.heard.innerHTML = `${Math.round(res.score*100)}% · Hai detto: <bdi class="ar">${esc(res.heard)}</bdi>`;
      if(res.pass){
        done++; fails=0; addStars(1); this.renderDots(done); this.mood("happy");
        const cheer = goodJob();
        const pi = Math.floor(Math.random()*PRAISE.length), p = PRAISE[pi];
        const close = res.labels ? res.labels.filter(l=>l==="close").length : 0;
        this.bubble(`${p[0]}${nm?" "+esc(nm)+"!":""} <span class="ar">${p[1]}</span> ⭐${close?"<br><small>Attento alle parole in arancione 🙂</small>":""}`);
        await (cheer ? this.say(cheer,"dieci") : this.say(`${p[0]}${nm?" "+nm:""}`, praiseKey(pi))); if(!alive()) return; await sleep(cheer?1500:500);
      } else {
        fails++; this.mood("sad");
        if(res.manual){ this.bubble("Riproviamo insieme! 💪"); await this.say("Riproviamo insieme!","riprova"); }
        else if(res.error==="no-speech"){
          const msg = res.peak>.15 ? "Ti ho sentito, ma non ho capito le parole. Parla più piano e più chiaro 🙂" : "Non ti ho sentito… avvicinati al telefono e parla più forte 🙂";
          this.bubble(msg); await (res.peak>.15 ? this.say("Ti ho sentito, ma non ho capito. Parla più piano e più chiaro.","noncapito") : this.say("Non ti ho sentito. Parla più forte.","nonsento"));
        }
        else if(res.error){ this.bubble("Il riconoscimento vocale ha avuto un problema (internet?). Riproviamo 🔁"); await this.say("Riproviamo.","riprova"); }
        else {
          const n=res.labels.length, okN=res.labels.filter(l=>l==="ok").length;
          const wrongW = this.o.items[this.i].ar.split(/\s+/).filter((w,k)=>res.labels[k]!=="ok");
          this.bubble(`Hai detto bene <b>${okN} parole su ${n}</b>. Da correggere: ${wrongW.slice(0,4).map(w=>`<span class="wtag">${esc(w)}</span>`).join(" ")}`);
          await (Phr.has("quasi") ? this.say("","quasi") : this.say(`Quasi! Hai detto bene ${okN} parole su ${n}.`,"quasi")); if(!alive()) return;
          if(res.url && st.record){
            this.mood("talk"); this.bubble("Ascolta come l'hai detta tu… 👂"); await this.say("Ascolta come l'hai detta tu.","tuavoce"); if(!alive()) return;
            await Player.play([res.url]); if(!alive()) return;
          }
          if(st.coach){ await this.coach(alive, res); }
        }

    const last = this.i >= this.o.items.length-1;

const FX_PRESETS = {
  naturale:{label:"🎤 Naturale", rev:0, size:1, warm:30, clar:30, comp:40},
  studio:{label:"🎧 Studio", rev:15, size:1.3, warm:50, clar:50, comp:60},

  grande:{label:"🌙 Grande moschea", rev:50, size:4.5, warm:60, clar:40, comp:70}
};
function makeImpulse(ctx, seconds, decay){
  const sr=ctx.sampleRate, len=Math.max(1,Math.floor(sr*seconds)), ir=ctx.createBuffer(2,len,sr);
  for(let ch=0; ch<2; ch++){ const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++){ const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,decay); }
    // prime riflessioni delle pareti
    [0.013,0.021,0.034,0.047,0.061].forEach((t,k)=>{ const i=Math.floor(t*sr)+ch*37; if(i<len) d[i]+= (k%2?-1:1)*(0.6-k*0.09); });
  }
  return ir;
}
async function renderFx(buf, fx){
  const sr=buf.sampleRate, rev=fx.rev/100, tail = rev>0 ? fx.size+0.3 : 0.1;
  const ctx = new OfflineAudioContext(2, Math.ceil((buf.duration+tail)*sr), sr);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=85; hp.Q.value=.7;
  const low=ctx.createBiquadFilter(); low.type="lowshelf"; low.frequency.value=180; low.gain.value=fx.warm/100*6;
  const mud=ctx.createBiquadFilter(); mud.type="peaking"; mud.frequency.value=420; mud.Q.value=1; mud.gain.value=-fx.warm/100*3;
  const pres=ctx.createBiquadFilter(); pres.type="peaking"; pres.frequency.value=3200; pres.Q.value=.9; pres.gain.value=fx.clar/100*5;
  const air=ctx.createBiquadFilter(); air.type="highshelf"; air.frequency.value=9000; air.gain.value=fx.clar/100*3;
  const c=fx.comp/100, comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12-c*20; comp.ratio.value=1.5+c*4.5; comp.knee.value=12; comp.attack.value=.005; comp.release.value=.22;
  const makeup=ctx.createGain(); makeup.gain.value=1+c*1.6;
  const dry=ctx.createGain(); dry.gain.value=1-rev*.35;
  src.connect(hp); hp.connect(low); low.connect(mud); mud.connect(pres); pres.connect(air); air.connect(comp); comp.connect(makeup); makeup.connect(dry); dry.connect(ctx.destination);
  if(rev>0){
    const pre=ctx.createDelay(1); pre.delayTime.value=.025+fx.size*.01;
    const conv=ctx.createConvolver(); conv.buffer=makeImpulse(ctx, fx.size, 2.2+fx.size*.35);
    const damp=ctx.createBiquadFilter(); damp.type="lowpass"; damp.frequency.value=6500;
    const wet=ctx.createGain(); wet.gain.value=rev*1.1;
    makeup.connect(pre); pre.connect(conv); conv.connect(damp); damp.connect(wet); wet.connect(ctx.destination);
  }
  src.start();
  const out = await ctx.startRendering();
  let peak=0; for(let ch=0; ch<out.numberOfChannels; ch++){ const d=out.getChannelData(ch); for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(v>peak) peak=v; } }
  if(peak>0){ const g=.95/peak; for(let ch=0; ch<out.numberOfChannels; ch++){ const d=out.getChannelData(ch); for(let i=0;i<d.length;i++) d[i]*=g; } }
  return out;
}
function wavBlob(buf){
  const ch=buf.numberOfChannels, sr=buf.sampleRate, n=buf.length, bytes=44+n*ch*2, ab=new ArrayBuffer(bytes), v=new DataView(ab);
  const ws=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  ws(0,"RIFF"); v.setUint32(4,bytes-8,true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*ch*2,true); v.setUint16(32,ch*2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,n*ch*2,true);
  const data=[]; for(let c=0;c<ch;c++) data.push(buf.getChannelData(c));
  let o=44; for(let i=0;i<n;i++) for(let c=0;c<ch;c++){ const x=Math.max(-1,Math.min(1,data[c][i])); v.setInt16(o, x<0?x*0x8000:x*0x7FFF, true); o+=2; }
  return new Blob([ab],{type:"audio/wav"});
}

// Ritaglio della foto in un cerchio: trascina per spostare, cursore per lo zoom
function cropPhoto(file){
  return new Promise(resolve=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast("Non riesco ad aprire questa foto"); resolve(null); };
    img.onload = () => {
      const S = 280, OUT = 320;
      const d = document.createElement("div"); d.className="crop";
      d.innerHTML = `<b style="font-family:Fredoka,'Baloo 2',sans-serif;font-size:22px">Sistema la foto</b><small>Trascina per spostare, usa il cursore per ingrandire</small>
        <canvas width="${S*2}" height="${S*2}" style="width:${S}px;height:${S}px"></canvas>
        <input type="range" min="1" max="4" step="0.01" value="1">
        <div style="display:flex;gap:10px"><button class="btn sec" data-x="no">Annulla</button><button class="btn green big" data-x="ok">✔ Usa questa foto</button></div>`;
      document.body.appendChild(d);
      const cv = d.querySelector("canvas"), ctx = cv.getContext("2d"), zoom = d.querySelector("input");
      const base = Math.max(S/img.width, S/img.height); let z=1, ox=0, oy=0;
      const clamp = () => { const w=img.width*base*z, h=img.height*base*z; ox=Math.min(0,Math.max(S-w,ox)); oy=Math.min(0,Math.max(S-h,oy)); };
      // centra all'inizio
      ox = (S - img.width*base)/2; oy = (S - img.height*base)/2; clamp();
      const draw = (c, size) => { const k=size/S; c.fillStyle="#fff"; c.fillRect(0,0,size,size); c.drawImage(img, ox*k, oy*k, img.width*base*z*k, img.height*base*z*k); };
      const redraw = () => draw(ctx, S*2);
      redraw();
      zoom.oninput = () => { const cx=S/2, cy=S/2, nz=+zoom.value; ox = cx-(cx-ox)*nz/z; oy = cy-(cy-oy)*nz/z; z=nz; clamp(); redraw(); };
      let drag=null;
      cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,ox,oy}; };
      cv.onpointermove = e => { if(!drag) return; const r=S/cv.getBoundingClientRect().width; ox=drag.ox+(e.clientX-drag.x)*r; oy=drag.oy+(e.clientY-drag.y)*r; clamp(); redraw(); };
      cv.onpointerup = cv.onpointercancel = () => { drag=null; };
      d.onclick = e => { const x=e.target.dataset.x; if(!x) return;
        let out=null; if(x==="ok"){ const oc=document.createElement("canvas"); oc.width=oc.height=OUT; draw(oc.getContext("2d"), OUT); out=oc.toDataURL("image/jpeg",0.85); }
        d.remove(); URL.revokeObjectURL(url); resolve(out); };
    };
    img.src = url;
  });
}

function FQS(){ S.set.fq = Object.assign({sound:true, music:false, n:20, timer:"auto", read:"auto", exclude:[], pin:null}, S.set.fq||{}); return S.set.fq; }
FQ.custom = null; FQ.unlocked = false;
FQ.loadCustom = async function(force){ if(this.custom && !force) return; const list = await this.all("fq_questions"); this.custom = {}; list.forEach(q=>{ this.custom[q.id]=q; }); this._merged=null; };
FQ.all_q = function(){ if(this._merged) return this._merged; const m=new Map(); FQ_BANK.forEach(q=>m.set(q.id, q)); Object.values(this.custom||{}).forEach(q=>{ if(q.deleted) m.delete(q.id); else m.set(q.id, Object.assign({}, q, {custom:true})); }); this._merged=[...m.values()]; return this._merged; };
FQ.byId = function(id){ return this.all_q().find(q=>q.id===id); };
FQ.saveQ = async function(q){ const ok = await this.put("fq_questions", q); await this.loadCustom(true); return ok; };
FQ.deleteQ = async function(id){ if(FQ_BANK.some(q=>q.id===id)) await this.put("fq_questions", {id, deleted:true}); else await this.del("fq_questions", id); await this.loadCustom(true); };
function fqPool(age, cats){ const ex = FQS().exclude; return FQ.all_q().filter(q=>q.age===age && q.status==="verificata" && !ex.includes(q.cat) && (!cats || !cats.length || cats.includes(q.cat))); }
function fqPickQuestions(age, n, cats){
  const pool = fqPool(age, cats); const used=new Set(); const out=[];
  const sched = FQ_SCHED[n] || FQ_SCHED[20].slice(0,n);
  for(const lvl of sched){
    let cands = pool.filter(q=>!used.has(q.id) && q.level===lvl);
    for(let d=1; !cands.length && d<5; d++) cands = pool.filter(q=>!used.has(q.id) && (q.level===lvl-d || q.level===lvl+d));
    if(!cands.length) break;
    const q = cands[Math.floor(Math.random()*cands.length)]; used.add(q.id); out.push(q);
  }
  return out;
}

  const rows=list.map(q=>{ q=fqClean(q); const o={id:q.id,age:q.age,cat:q.cat,level:q.level,correct:"ABCD"[q.correct],status:q.status,src:q.src}; FQ_LANGS3.forEach(l=>{ o[l+"_q"]=q[l].q; q[l].a.forEach((a,k)=>o[l+"_a"+(k+1)]=a); o[l+"_hint"]=q[l].hint; o[l+"_exp"]=q[l].exp; }); return FQ_CSV_COLS.map(c=>cell(o[c])).join(","); });
  return [FQ_CSV_COLS.join(",")].concat(rows).join("\r\n"); }
function fqParseCSV(text){ text=text.replace(/^﻿/,""); const first=text.split(/\r?\n/)[0]; const sep=(first.split(";").length>first.split(",").length)?";":",";
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(cell); cell=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift().map(h=>h.trim()); return rows.filter(r=>r.some(x=>x.trim())).map(r=>{ const o={}; head.forEach((h,k)=>o[h]=r[k]||""); return o; }); }
async function fqImport(file){
  const text = await file.text(); let items=[]; const bad=[];
  try{
    if(/\.csv$/i.test(file.name) || /^[﻿]?id[,;]/.test(text)){
      items = fqParseCSV(text).map(o=>{ const q={id:o.id, age:o.age, cat:o.cat, level:+o.level, correct:"ABCD".indexOf(String(o.correct).trim().toUpperCase())>=0?"ABCD".indexOf(String(o.correct).trim().toUpperCase()):+o.correct, status:o.status||"da verificare", src:o.src};
        FQ_LANGS3.forEach(l=>{ q[l]={q:o[l+"_q"], a:[1,2,3,4].map(k=>o[l+"_a"+k]), hint:o[l+"_hint"], exp:o[l+"_exp"]}; }); return q; });
    } else { const j=JSON.parse(text); items = Array.isArray(j) ? j : (j.questions||[]); }
  }catch(e){ return {ok:0, bad:["File non leggibile: "+e.message]}; }
  let ok=0;
  for(const raw of items){ const q=fqClean(raw);
    if(!q.id || !FQ.AGE.some(g=>g.id===q.age) || !FQ_CATS[q.cat]){ bad.push(`${q.id||"(senza id)"}: manca id, fascia o categoria valida`); continue; }
    const err=fqValidate(q); if(err.length && q.status==="verificata") q.status="bozza";
    if(err.length) bad.push(`${q.id}: importata come bozza (manca ${err[0]})`);

  await FQ.loadCustom(true); return {ok, bad}; }
function fqDuplicates(all){ const words=t=>new Set(String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9؀-ۿ ]/g," ").split(/\s+/).filter(w=>w.length>2 || /\d/.test(w)));
  const out=[]; FQ.AGE.forEach(g=>{ const qs=all.filter(q=>q.age===g.id).map(q=>[q, words(q.it ? q.it.q+" "+(q.it.a[q.correct]||"") : "")]);
    for(let i=0;i<qs.length;i++) for(let j=i+1;j<qs.length;j++){ const A=qs[i][1], B=qs[j][1]; if(!A.size||!B.size) continue; let inter=0; A.forEach(w=>{ if(B.has(w)) inter++; }); const sim=inter/(A.size+B.size-inter); if(sim>=.75) out.push([qs[i][0], qs[j][0], sim]); } });
  return out.sort((a,b)=>b[2]-a[2]); }

function pinDialog(setNew){

    const c=FQS(); let stage = setNew||!c.pin ? "new" : "ask", first="", cur="";
    const d=document.createElement("div"); d.className="family"; document.body.appendChild(d);

    const draw = (msg) => { d.innerHTML = `<div style="font-family:Fredoka,'Baloo 2';font-size:24px;font-weight:700">${title()}</div><div style="min-height:22px;color:#FFC93C">${msg||""}</div>

      <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"✖",0,"⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>`; };
    draw(stage==="new" && !setNew ? "Serve per proteggere la gestione delle domande." : "");
    d.onclick = async e => { const b=e.target.closest("button"); if(!b) return; const k=b.dataset.k;
      if(k==="✖"){ d.remove(); resolve(false); return; } if(k==="⌫"){ cur=cur.slice(0,-1); draw(); return; }
      if(cur.length<4) cur+=k; draw(); if(cur.length<4) return;
      if(stage==="ask"){ if(await fqHash(cur)===c.pin){ d.remove(); resolve(true); } else { cur=""; draw("PIN sbagliato, riprova"); } }
      else if(stage==="new"){ first=cur; cur=""; stage="rep"; draw(); }
      else { if(cur===first){ c.pin=await fqHash(cur); Store.save(); d.remove(); resolve(true); } else { cur=""; first=""; stage="new"; draw("I due PIN non coincidono, ricomincia"); } } };
  });
}

  "prova-mic"(){
    setHeader("Prova del microfono", true);
    app.innerHTML = `<div class="card"><div class="teacher"><div class="owlBox" style="width:90px;flex:none"></div><div class="bubble" id="pmB">Tocca <b>Inizia la prova</b> e di' ad alta voce: <span class="quran" style="font-size:24px">بِسۡمِ ٱللَّهِ</span></div></div>
      <div class="center hidden mt" id="pmRec"><span class="rec-badge">Ti sto ascoltando…</span><div class="lvl"><i id="pmL"></i></div></div>
      <div class="mt" id="pmRes"></div>
      <div class="center mt"><button class="btn big" id="pmGo">🎤 Inizia la prova</button></div></div>
      ${envNote()}`;
    const ow=owl(); $(".owlBox").appendChild(ow);
    const line = (ok,txt) => `<div class="chk"><b>${ok===true?"✅":ok===false?"❌":"➖"}</b><span>${txt}</span></div>`;
    $("#pmGo").onclick = async () => {
      Player.unlock(); const out=$("#pmRes"); out.innerHTML=""; $("#pmGo").disabled=true; ow.className="owl listen";
      let rows=[]; let micOk=false, url=null, heard="", srErr=null;
      if(Mic.supported()){ micOk = await Mic.open(); }
      rows.push(line(micOk, micOk ? "Microfono autorizzato" : "Microfono non disponibile"+(Mic.err?` (${Mic.err})`:"")+": consenti il microfono a Chrome"));
      let recOn = micOk && Mic.start();
      $("#pmRec").classList.remove("hidden"); Mic.onLevel = v => { $("#pmL").style.width=Math.round(v*100)+"%"; };
      const r = SR ? await Rec.listen({maxMs:6000, onInterim:t=>{$("#pmB").innerHTML=`Sento: <bdi class="ar">${esc(t)}</bdi>`;}}) : {error:"unsupported"};
      const peak = Mic.peak; url = recOn ? await Mic.stop() : null; Mic.close(); Mic.onLevel=null; $("#pmRec").classList.add("hidden");
      heard = r.text||""; srErr = r.error;
      rows.push(line(recOn ? !!url : null, recOn ? (url ? `Registrazione della voce ok (volume massimo ${Math.round(peak*100)}%)` : "Registrazione vuota") : "Registrazione non provata"));
      let srOk = !!heard;
      if(!srOk && recOn && SR){ // riprova senza registrazione: forse il telefono non le regge insieme
        $("#pmB").innerHTML = "Riproviamo solo l'ascolto: ripeti <span class='quran' style='font-size:24px'>بِسۡمِ ٱللَّهِ</span>";
        const r2 = await Rec.listen({maxMs:6000}); heard=r2.text||""; srErr=r2.error;
        if(heard){ S.set.recConflict=true; Store.save(); rows.push(line(null,"Su questo telefono ascolto e registrazione insieme non funzionano: il maestro userà solo l'ascolto.")); }
        srOk=!!heard;
      } else if(srOk && recOn){ S.set.recConflict=false; Store.save(); }
      rows.push(line(SR ? srOk : false, !SR ? "Riconoscimento vocale non presente: usa Google Chrome su Android" : srOk ? `Riconoscimento arabo ok: ho capito <bdi class="ar" style="font-size:20px">${esc(heard)}</bdi>` : `Riconoscimento non riuscito (${esc(srErr||"nessun suono")})`));
      const help = !micOk ? micHelp(Mic.err||"NotAllowedError") : (!srOk && srErr && srErr!=="no-speech") ? micHelp(srErr) : "";
      out.innerHTML = rows.join("") + (help?`<div class="note err mt">${help}</div>`:"") + (url?`<div class="center mt"><button class="btn sec" id="pmPlay">▶ Ascolta la tua voce</button></div>`:"");
      if(url) $("#pmPlay").onclick = () => Player.play([url]);
      ow.className = "owl " + (srOk ? "happy" : "sad");
      $("#pmB").innerHTML = srOk ? "Perfetto! Bayan ti sente bene 🎉" : "Qualcosa non va: guarda la lista qui sotto 👇";
      if(url && srOk){ await Player.play([url]); }
      $("#pmGo").disabled=false; $("#pmGo").textContent="🔁 Rifai la prova";
    };
  },
  studio(){
    setHeader("Studio del Muqri'", true);
    const st = S.studio = Object.assign({sura:1, from:1, to:7, preset:"moschea"}, S.studio||{});
    app.innerHTML = `${envNote()}
    <div class="card">
      <div class="teacher"><div class="owlBox" style="width:80px;flex:none"></div><div class="bubble" id="stB">Scegli la sura, ascolta il recitatore se vuoi, poi premi <b>⏺ Registra</b> e recita con calma.</div></div>
      <div class="set-row mt"><label>Sura</label><select id="stS">${QURAN.map(x=>`<option value="${x.n}">${x.n}. ${esc(x.tr)} – ${x.name}</option>`).join("")}</select></div>
      <div class="set-row" style="display:flex;gap:10px"><div style="flex:1"><label style="font-weight:800">Dall'ayah</label><select id="stA"></select></div><div style="flex:1"><label style="font-weight:800">All'ayah</label><select id="stZ"></select></div></div>
      <div class="quran" id="stTxt" style="font-size:27px;line-height:2.1;text-align:center;max-height:42vh;overflow:auto;background:#FFFCF5;border-radius:16px;padding:8px"></div>
      <div class="center hidden mt" id="stRec"><span class="rec-badge">Registrazione <span id="stT">0:00</span></span><div class="lvl"><i id="stL"></i></div></div>
      <div class="controls"><button class="btn sec" id="stListen">🔊 Ascolta il recitatore</button><button class="btn big red" id="stGo">⏺ Registra</button></div>
    </div>
    <div class="card mt hidden" id="stFx">
      <div style="font-weight:800;font-size:20px">🎚️ Rendi bella la tua voce</div>
      <div class="chips mt" id="stP">${Object.entries(FX_PRESETS).map(([k,p])=>`<button class="chip" data-p="${k}">${p.label}</button>`).join("")}</div>
      <div class="slider mt"><label>🕌 Eco della moschea <span id="vRev"></span></label><input type="range" id="fRev" min="0" max="80"></div>
      <div class="slider"><label>🔥 Voce più calda e piena <span id="vWarm"></span></label><input type="range" id="fWarm" min="0" max="100"></div>
      <div class="slider"><label>✨ Chiarezza <span id="vClar"></span></label><input type="range" id="fClar" min="0" max="100"></div>
      <div class="slider"><label>📢 Volume uniforme (compressore) <span id="vComp"></span></label><input type="range" id="fComp" min="0" max="100"></div>
      <div class="controls"><button class="btn sec" id="pOrig">▶ Originale</button><button class="btn purple big" id="pFx">▶ Con effetto</button><button class="btn sec sq" id="pStop">⏹</button></div>
      <div class="controls"><button class="btn green" id="sKeep">⭐ Salva nelle mie recitazioni</button><button class="btn sec" id="sDown">💾 Scarica</button><button class="btn sec" id="sShare">📤 Condividi</button></div>
      <div class="note">ℹ️ L'effetto migliora suono e ambiente (eco, calore, volume): la bellezza della recitazione resta la tua 🙂</div>
    </div>
    <div class="card mt"><div style="font-weight:800;font-size:19px">📂 Le mie recitazioni</div><div id="stList"><small style="color:var(--muted)">Nessuna ancora.</small></div></div>`;
    const ow=owl(); $(".owlBox").appendChild(ow);
    const selS=$("#stS"), selA=$("#stA"), selZ=$("#stZ");
    const sura = () => QURAN.find(x=>x.n===st.sura);
    const fillAyat = () => { const n=sura().c; st.from=Math.min(st.from,n); st.to=Math.min(Math.max(st.to,st.from),n);
      selA.innerHTML = selZ.innerHTML = Array.from({length:n},(_,k)=>`<option value="${k+1}">${k+1}</option>`).join(""); selA.value=st.from; selZ.value=st.to; showTxt(); };
    const showTxt = async () => { $("#stTxt").innerHTML="⏳"; const x=await loadSura(st.sura);
      if(!x){ $("#stTxt").innerHTML="<span style='font-family:Baloo 2'>Serve internet per caricare il testo 📶</span>"; return; } let h = (x.n!==1 && x.n!==9 && st.from===1) ? `<div style="font-size:22px;color:var(--teal-d)">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>` : "";
      h += x.v.slice(st.from-1, st.to).map((v,k)=>`${esc(v[0])} <span style="color:var(--teal);font-size:20px">﴿${(st.from+k).toLocaleString("ar-EG")}﴾</span>`).join(" "); $("#stTxt").innerHTML=h; Store.save(); };
    selS.value=st.sura; fillAyat();
    selS.onchange=()=>{ st.sura=+selS.value; st.from=1; st.to=sura().c; fillAyat(); };
    selA.onchange=()=>{ st.from=+selA.value; if(st.to<st.from) st.to=st.from; selZ.value=st.to; showTxt(); };
    selZ.onchange=()=>{ st.to=+selZ.value; if(st.from>st.to) st.from=st.to; selA.value=st.from; showTxt(); };

    let listening=false;
    $("#stListen").onclick = async () => {
      if(listening){ listening=false; Player.stop(); $("#stListen").textContent="🔊 Ascolta il recitatore"; return; }
      listening=true; $("#stListen").textContent="⏹ Ferma ascolto"; const x=sura();
      for(let a=st.from; a<=st.to && listening; a++){ ow.className="owl talk"; const r=await Player.play(ayahUrls(x.n,a,x.start+a), 1); if(r!==true) break; }
      listening=false; ow.className="owl"; $("#stListen").textContent="🔊 Ascolta il recitatore";
    };

    // registrazione
    let recording=false, t0=0, timer=0, rawBlob=null, rawBuf=null, fxBlob=null, fxDirty=true;
    const fx = Object.assign({}, FX_PRESETS[st.preset]||FX_PRESETS.moschea);
    $("#stGo").onclick = async () => {
      if(recording){ return stopRec(); }
      Player.stop(); listening=false;
      if(!Mic.supported()){ $("#stB").innerHTML = "Questo browser non può registrare. Usa Google Chrome."; return; }
      $("#stB").innerHTML="Chiedo il permesso del microfono… se compare la richiesta tocca <b>Consenti</b>.";
      if(!(await Mic.open()) || !Mic.start()){ ow.className="owl sad"; $("#stB").innerHTML = micHelp(Mic.err||"NotAllowedError"); return; }
      recording=true; t0=Date.now(); ow.className="owl listen"; $("#stB").innerHTML="Ti sto registrando… recita con calma 🎙️"; $("#stRec").classList.remove("hidden");
      $("#stGo").textContent="⏹ Stop"; $("#stGo").classList.replace("red","orange");
      Mic.onLevel = v => { $("#stL").style.width=Math.round(v*100)+"%"; };
      timer=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); $("#stT").textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; if(sec>=600) stopRec(); },250);
    };
    const stopRec = async () => {
      recording=false; clearInterval(timer); $("#stRec").classList.add("hidden"); $("#stGo").textContent="⏺ Registra di nuovo"; $("#stGo").classList.replace("orange","red");
      const url = await Mic.stop(); Mic.close(); Mic.onLevel=null;
      if(!url){ ow.className="owl sad"; $("#stB").innerHTML="La registrazione è vuota. Fai la prova del microfono 🎤"; return; }
      ow.className="owl"; $("#stB").innerHTML="Preparo la tua voce… ⏳";
      try{
        rawBlob = await (await fetch(url)).blob();
        const AC = window.AudioContext||window.webkitAudioContext; const ac = Mic.ctx || (Mic.ctx = new AC());
        rawBuf = await ac.decodeAudioData(await rawBlob.arrayBuffer());
        fxDirty=true; $("#stFx").classList.remove("hidden"); ow.className="owl happy";
        $("#stB").innerHTML="Fatto! Ascolta la tua voce <b>con l'effetto</b> 👇"; $("#stFx").scrollIntoView({behavior:"smooth"});
      }catch(e){ ow.className="owl sad"; $("#stB").innerHTML="Non riesco a leggere la registrazione su questo telefono 😕"; }
    };

    // effetti
    const sliders = [["fRev","vRev","rev"],["fWarm","vWarm","warm"],["fClar","vClar","clar"],["fComp","vComp","comp"]];
    const syncFx = () => { sliders.forEach(([i,v,k])=>{ $("#"+i).value=fx[k]; $("#"+v).textContent=fx[k]; });
      document.querySelectorAll("#stP .chip").forEach(c=>c.classList.toggle("on", c.dataset.p===st.preset)); };
    sliders.forEach(([i,v,k])=>{ $("#"+i).oninput = e => { fx[k]=+e.target.value; $("#"+v).textContent=fx[k]; fxDirty=true; st.preset=""; syncFx(); }; });
    $("#stP").onclick = e => { const k=e.target.dataset.p; if(!k) return; st.preset=k; Object.assign(fx, FX_PRESETS[k]); fxDirty=true; Store.save(); syncFx(); $("#pFx").click(); };
    syncFx();
    const getFx = async () => {
      if(!rawBuf) return null;
      if(fxDirty || !fxBlob){ $("#pFx").textContent="⏳ Elaboro…"; const out = await renderFx(rawBuf, fx); fxBlob = wavBlob(out); fxDirty=false; $("#pFx").textContent="▶ Con effetto"; }
      return fxBlob;
    };
    const title = () => { const x=sura(); return `${x.tr} ${st.from}-${st.to}`; };
    const fname = () => `${title().replace(/[^\w-]+/g,"_")}_${new Date().toISOString().slice(0,10)}.wav`;
    let fxUrl=null;
    $("#pOrig").onclick = () => { if(rawBlob){ Player.play([URL.createObjectURL(rawBlob)]); } };
    $("#pFx").onclick = async () => { Player.unlock(); const b=await getFx(); if(!b) return; if(fxUrl) URL.revokeObjectURL(fxUrl); fxUrl=URL.createObjectURL(b); Player.play([fxUrl]); };
    $("#pStop").onclick = () => Player.stop();
    $("#sDown").onclick = async () => { const b=await getFx(); if(b) saveBlob(b, fname()); };
    $("#sShare").onclick = async () => { const b=await getFx(); if(!b) return; if(!(await shareBlob(b, fname()))) saveBlob(b, fname()); };
    $("#sKeep").onclick = async () => { const b=await getFx(); if(!b) return;
      const ok = await RecDB.put({id:Date.now(), title:title(), date:new Date().toLocaleString("it-IT"), preset:st.preset, blob:b});
      $("#stB").innerHTML = ok ? "Salvata nelle tue recitazioni ⭐" : "Non riesco a salvarla su questo telefono: usa 💾 Scarica.";
      if(ok){ addStars(2); renderList(); } };
    const renderList = async () => {
      const all = await RecDB.all(); const L=$("#stList"); if(!L) return;
      if(!all.length){ L.innerHTML=`<small style="color:var(--muted)">Nessuna ancora.</small>`; return; }
      L.innerHTML = all.map(r=>`<div class="recitem"><span class="t">${esc(r.title)}<small>${esc(r.date)}${r.preset&&FX_PRESETS[r.preset]?" · "+FX_PRESETS[r.preset].label:""}</small></span>
        <button data-a="play" data-id="${r.id}">▶</button><button data-a="share" data-id="${r.id}">📤</button><button data-a="del" data-id="${r.id}">🗑</button></div>`).join("");
      L.onclick = async e => { const b=e.target.closest("button"); if(!b) return; const r=all.find(x=>x.id===+b.dataset.id); if(!r) return;
        if(b.dataset.a==="play") Player.play([URL.createObjectURL(r.blob)]);
        if(b.dataset.a==="share"){ const n=r.title.replace(/[^\w-]+/g,"_")+".wav"; if(!(await shareBlob(r.blob,n))) saveBlob(r.blob,n); }
        if(b.dataset.a==="del"){ if(b.dataset.sure){ await RecDB.del(r.id); renderList(); } else { b.dataset.sure=1; b.textContent="❓"; setTimeout(()=>{ if(b.isConnected){ b.textContent="🗑"; delete b.dataset.sure; } },2500); } }
      };
    };
    renderList();
  },
  async sura(n){
    const s = QURAN.find(x=>x.n===n); if(!s) return Views.corano();
    setHeader(`${s.tr} · ${s.name}`, true);
    app.innerHTML = `<div class="card center">⏳ Carico la sura…</div>`;
    const ok = await loadSura(n);
    if(location.hash !== "#sura-"+n) return;
    if(!ok){ app.innerHTML = `<div class="note err">Non riesco a caricare il testo della sura. Controlla internet 📶 e riprova.</div>`; return; }
    app.innerHTML = `<div id="les"></div>`;
    S.ayat[n] = S.ayat[n] || {};
    currentLesson = new Lesson($("#les"), {
      kind:"quran", items: s.v.map(v=>({ar:v[0], tr:v[1]})),
      metaText:i=>`Ayah ${i+1} di ${s.v.length}`,
      play:(i,rate)=>Player.play(ayahUrls(n, i+1, s.start+i+1), rate),
      playWord:(i,k,rate)=>Player.play([`https://audio.qurancdn.com/wbw/${pad3(n)}_${pad3(i+1)}_${pad3(k+1)}.mp3`], Math.min(1,rate)),
      intro: async (i, alive, L) => {
        if(i===0 && n!==1 && n!==9 && S.set.basmala){
          L.mood("talk"); L.bubble(`<span class="quran" style="font-size:24px">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</span>`);
          const r = await Player.play(ayahUrls(1,1,1), L.rate()); if(r==="blocked" && alive()){ await L.waitButtons([["🔊 Ascolta","orange",1]]); }
        }
      },
      isDone:i=>!!S.ayat[n][i], markDone:i=>{ S.ayat[n][i]=1; Store.save(); }
    });
  }
};

function quizGame(g){
  let round=0, score=0, q=null, tries=0;
  const next = () => {
    if(round>=g.rounds){ app.innerHTML = `<div class="card center"><div style="font-size:70px">🏆</div><div class="sec-title">Bravo! ${score}/${g.rounds} al primo colpo</div>
      <button class="btn big" id="again">🔄 Gioca ancora</button></div>`; addStars(3); confetti(); $("#again").onclick=()=>{round=0;score=0;next();}; return; }
    q = g.make(); tries=0; round++;
    app.innerHTML = `<div class="progress-txt">Domanda ${round} di ${g.rounds} · ✅ ${score}</div><div class="card mt">${g.ask(q)}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${g.word?"word":""}" data-i="${i}">${g.optHtml(o)}</button>`).join("")}</div>`;
    const oq=$(".owlQ"); if(oq) oq.appendChild(owl("talk"));
    const sb=$("[data-say]"); if(sb){ sb.onclick=()=>g.say(q); g.say(q).then(()=>{ const o=$(".owlQ .owl"); if(o) o.className="owl"; }); }
    $(".opts").onclick = async e => {
      const b=e.target.closest(".opt"); if(!b||b.disabled) return; const o=q.opts[+b.dataset.i];
      if(g.isRight(q,o)){ b.classList.add("right"); document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        if(tries===0){ score++; addStars(1); } const ch=goodJob(); if(ch) await sayP("dieci",ch); else if(g.after) await g.after(q); await sleep(ch?1800:700); next(); }
      else { tries++; b.classList.add("wrong"); b.disabled=true; }
    };
  };
  next();
}

function route(){
  if(currentLesson){ currentLesson.stop(); currentLesson=null; }
  Player.stop(); Rec.stop(); Voice.stop(); Mic.stop().then(()=>Mic.close());
  app.onclick = null;
  { const c=document.getElementById("cele"); if(c) c.remove(); document.querySelectorAll(".crop,.family").forEach(x=>x.remove()); if(fqCleanup){ fqCleanup(); fqCleanup=null; } }
  const h = location.hash.slice(1) || "home";
  window.scrollTo(0,0);
  const sec = h.startsWith("sura-")||h==="corano" ? "corano" : h.startsWith("hadith")||h==="ahadith" ? "ahadith" : (["giochi","alfabeto","ascolta","parole","memory","fq"].includes(h) || h.startsWith("fq-")) ? "giochi" : h==="studio" ? "studio" : h==="home" ? "home" : "";
  document.querySelectorAll("#tabbar a").forEach(a=>a.classList.toggle("on", a.dataset.t===sec));
  if(h.startsWith("sura-")) return Views.sura(+h.slice(5));
  if(h.startsWith("hadith-")) return Views.hadith(+h.slice(7));
  if(h.startsWith("fq-player-")) return Views.fqPlayer(h.slice(10));
  if(h.startsWith("fq-edit-")) return Views.fqEdit(h.slice(8));
  (Views[h] || Views.home)();
}
window.addEventListener("hashchange", route);
FQ.loadCustom();
async function checkUpdate(){
  if(location.protocol!=="https:" && location.hostname!=="localhost") return;
  try{ const r = await fetch(location.pathname + "?check=" + Date.now(), {cache:"no-store"}); const t = await r.text();
    const m = t.match(/const APP_VERSION = "([^"]+)"/); if(!m || m[1]===APP_VERSION || document.querySelector(".updbar")) return;
    const d=document.createElement("div"); d.className="updbar"; d.innerHTML = `<span style="font-size:26px">🎉</span><b>È pronta la nuova versione ${esc(m[1])}!</b><button class="btn green">🔄 Aggiorna</button>`;
    d.querySelector("button").onclick = () => location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]) + location.hash);
    document.body.appendChild(d); }catch(e){} }
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") checkUpdate(); });
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("starN").textContent = S.stars;
route();
setTimeout(()=>{ if(!location.hash || location.hash==="#home") route(); }, 1200); // ridisegna quando le voci sono caricate
</script>
